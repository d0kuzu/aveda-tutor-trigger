services:
  aveda-tutor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.zerde.co/diaxel}
        VITE_ASSISTANT_ID: ${VITE_ASSISTANT_ID:-7de674c1-6029-4609-92c4-074fab740bad}
    container_name: aveda-tutor
    restart: unless-stopped
    ports:
      - "${PORT:-3005}:80"
